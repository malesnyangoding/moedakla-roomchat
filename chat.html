<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Chat - Room List</title>
    
    <!-- Link CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="particles" id="particles"></div>
    
    <!-- Gradient Orbs Background -->
    <div class="gradient-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <!-- Main Container -->
    <div class="room-container">
        <!-- Header Section -->
        <header class="room-header">
            <div class="header-content">
                <div class="user-info">
                    <div class="avatar">
                        <span id="user-initial">R</span>
                    </div>
                    <div class="user-details">
                        <h3 id="username">Rendi</h3>
                        <p id="user-class">Kelas XII</p>
                    </div>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="profile-btn" id="profileBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </button>
                    <button class="logout-btn" id="logoutBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                            <polyline points="16 17 21 12 16 7"></polyline>
                            <line x1="21" y1="12" x2="9" y2="12"></line>
                        </svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Room List Section -->
        <div class="room-list-wrapper">
            <h2 class="section-title">Pilih Room Chat</h2>
            
            <div class="rooms-grid">
                <!-- Room Card: All Class -->
                <div class="room-card" data-room="all-class">
                    <div class="room-icon all-class">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </div>
                    <div class="room-content">
                        <h3>All Class</h3>
                        <p>Semua kelas berkumpul disini</p>
                        <div class="room-stats">
                            <span class="online-count">
                                <span class="dot"></span>
                                <span id="all-online">24</span> Online
                            </span>
                        </div>
                    </div>
                    <div class="room-arrow">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                </div>

                <!-- Room Card: Kelas X -->
                <div class="room-card" data-room="kelas-x">
                    <div class="room-icon kelas-x">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                            <text x="12" y="16" font-size="10" fill="currentColor" text-anchor="middle" font-weight="bold">X</text>
                        </svg>
                    </div>
                    <div class="room-content">
                        <h3>Kelas X</h3>
                        <p>Room khusus kelas X</p>
                        <div class="room-stats">
                            <span class="online-count">
                                <span class="dot"></span>
                                <span id="x-online">8</span> Online
                            </span>
                        </div>
                    </div>
                    <div class="room-arrow">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                </div>

                <!-- Room Card: Kelas XI -->
                <div class="room-card" data-room="kelas-xi">
                    <div class="room-icon kelas-xi">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                            <text x="12" y="16" font-size="9" fill="currentColor" text-anchor="middle" font-weight="bold">XI</text>
                        </svg>
                    </div>
                    <div class="room-content">
                        <h3>Kelas XI</h3>
                        <p>Room khusus kelas XI</p>
                        <div class="room-stats">
                            <span class="online-count">
                                <span class="dot"></span>
                                <span id="xi-online">12</span> Online
                            </span>
                        </div>
                    </div>
                    <div class="room-arrow">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                </div>

                <!-- Room Card: Kelas XII -->
                <div class="room-card" data-room="kelas-xii">
                    <div class="room-icon kelas-xii">
                        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                            <text x="12" y="16" font-size="8" fill="currentColor" text-anchor="middle" font-weight="bold">XII</text>
                        </svg>
                    </div>
                    <div class="room-content">
                        <h3>Kelas XII</h3>
                        <p>Room khusus kelas XII</p>
                        <div class="room-stats">
                            <span class="online-count">
                                <span class="dot"></span>
                                <span id="xii-online">15</span> Online
                            </span>
                        </div>
                    </div>
                    <div class="room-arrow">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="9 18 15 12 9 6"></polyline>
                        </svg>
                    </div>
                </div>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="footer-info">
            <p>💬 Pilih room untuk mulai ngobrol</p>
        </div>
    </div>

    <!-- Link JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
