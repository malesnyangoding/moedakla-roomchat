<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moedakla - Anonymous chat</title>
    
    <!-- Link CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/landing.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Animated Background Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>Moedakla - Roomchat</h1>
            <p>made by @chocolava_a</p>
        </div>

        <!-- Tab Switch (Login/Register) -->
        <div class="tab-container">
            <div class="tab-slider"></div>
            <div class="tab active" data-tab="login">Login</div>
            <div class="tab" data-tab="register">Register</div>
        </div>

        <!-- Forms Container -->
        <div class="forms-container">
            <!-- Login Form -->
            <div class="form-wrapper active" id="login-form">
                <form id="loginForm">
                    <div class="input-group">
                        <input type="text" id="login-username" required>
                        <label>Username</label>
                    </div>
                    
                    <div class="input-group">
                        <input type="password" id="login-password" required>
                        <label>Password</label>
                    </div>

                    <div class="remember-me">
                        <input type="checkbox" id="remember">
                        <label for="remember">Ingat Saya</label>
                    </div>

                    <button type="submit" class="btn-submit">Masuk</button>
                </form>
            </div>

            <!-- Register Form -->
            <div class="form-wrapper" id="register-form">
                <form id="registerForm">
                    <div class="input-group">
                        <input type="text" id="register-username" placeholder="Masukkan nama asli" required>
                        <label>Username</label>
                    </div>
                    
                    <div class="input-group">
                        <select id="register-kelas" required>
                            <option value="" disabled selected>Pilih Kelas</option>
                            <option value="X">Kelas X</option>
                            <option value="XI">Kelas XI</option>
                            <option value="XII">Kelas XII</option>
                        </select>
                        <label class="select-label">Kelas</label>
                    </div>

                    <button type="submit" class="btn-submit">Mendaftar</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Link JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
