<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anonymous Chat - Room</title>
    
    <!-- Link CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/room.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <!-- Animated Background -->
    <div class="particles" id="particles"></div>

    <!-- Chat Container -->
    <div class="chat-container">
        <!-- Chat Header -->
        <header class="chat-header">
            <button class="back-btn" id="backBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            
            <div class="room-info">
                <h3 id="roomName">All Class</h3>
                <p id="onlineCount">24 Online</p>
            </div>

            <button class="info-btn" id="infoBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                </svg>
            </button>
        </header>

        <!-- Balance Indicator (only shown if not in own class) -->
        <div class="balance-bar" id="balanceBar" style="display: none;">
            <div class="balance-content">
                <span class="balance-icon">💬</span>
                <span class="balance-text">Balance: <strong id="balanceCount">20</strong>/20</span>
                <span class="balance-reset">Reset in <span id="resetTimer">23:45:12</span></span>
            </div>
        </div>

        <!-- Chat Messages Area -->
        <div class="messages-container" id="messagesContainer">
            <!-- Messages will be dynamically added here -->
        </div>

        <!-- Typing Indicator -->
        <div class="typing-indicator" id="typingIndicator" style="display: none;">
            <div class="typing-avatar">A</div>
            <div class="typing-dots">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>

        <!-- Message Input Area -->
        <div class="message-input-area">
            <button class="voice-btn" id="voiceBtn" title="Voice Message">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
            </button>

            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type a message..." 
                    maxlength="500"
                    autocomplete="off"
                >
                <span class="char-count" id="charCount">0/500</span>
            </div>

            <button class="send-btn" id="sendBtn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <!-- Voice Recording Modal -->
    <div class="voice-modal" id="voiceModal" style="display: none;">
        <div class="voice-modal-content">
            <div class="voice-animation">
                <div class="voice-circle"></div>
                <div class="voice-wave"></div>
            </div>
            <p class="voice-status" id="voiceStatus">Recording...</p>
            <p class="voice-timer" id="voiceTimer">00:00</p>
            <div class="voice-controls">
                <button class="voice-cancel" id="voiceCancelBtn">Cancel</button>
                <button class="voice-send" id="voiceSendBtn">Send</button>
            </div>
        </div>
    </div>

    <!-- Info Modal -->
    <div class="info-modal" id="infoModal" style="display: none;">
        <div class="info-modal-content">
            <div class="info-header">
                <h3>Room Info</h3>
                <button class="close-modal" id="closeInfoModal">×</button>
            </div>
            <div class="info-body">
                <div class="info-item">
                    <span class="info-label">Room:</span>
                    <span class="info-value" id="modalRoomName">All Class</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Online:</span>
                    <span class="info-value" id="modalOnlineCount">24 users</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Your Class:</span>
                    <span class="info-value" id="modalUserClass">XII</span>
                </div>
                <div class="info-item" id="balanceInfo" style="display: none;">
                    <span class="info-label">Daily Balance:</span>
                    <span class="info-value" id="modalBalance">20/20</span>
                </div>
                <div class="info-note">
                    <p>💡 <strong>Note:</strong> You have unlimited messages in your class room. Other rooms limited to 20 messages/day.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Link JavaScript -->
    <script src="js/utils.js"></script>
    <script src="js/room.js"></script>
</body>
</html>
