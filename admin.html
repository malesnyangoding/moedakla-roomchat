<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Register User</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a0033 0%, #2d1b4e 50%, #1a0033 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .admin-container {
            background: rgba(30, 15, 50, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 25px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 80px rgba(138, 43, 226, 0.5);
            border: 1px solid rgba(138, 43, 226, 0.3);
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(138, 43, 226, 0.3);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: all 0.3s;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #8a2be2;
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.3);
        }

        select {
            cursor: pointer;
        }

        select option {
            background: #2d1b4e;
            color: white;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #8a2be2 0%, #9b59b6 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 6px 25px rgba(138, 43, 226, 0.4);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 35px rgba(138, 43, 226, 0.6);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert.success {
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid rgba(16, 185, 129, 0.5);
            color: #10b981;
        }

        .alert.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.5);
            color: #ef4444;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #8a2be2;
            text-decoration: none;
            font-size: 14px;
            transition: all 0.3s;
        }

        .back-link a:hover {
            color: #9b59b6;
        }

        .warning {
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.5);
            color: #f59e0b;
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <h1>🔐 Admin Panel</h1>
        <p class="subtitle">Register User Baru</p>

        <div class="warning">
            ⚠️ Halaman ini hanya untuk admin. Pastikan Admin Key benar!
        </div>

        <div class="alert" id="alert"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="adminKey">Admin Key *</label>
                <input type="password" id="adminKey" placeholder="Masukkan admin key" required>
            </div>

            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" placeholder="Minimal 6 karakter" required minlength="6">
            </div>

            <div class="form-group">
                <label for="kelas">Kelas *</label>
                <select id="kelas" required>
                    <option value="">Pilih Kelas</option>
                    <option value="X">Kelas X</option>
                    <option value="XI">Kelas XI</option>
                    <option value="XII">Kelas XII</option>
                </select>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Daftarkan User
            </button>
        </form>

        <div class="back-link">
            <a href="index.html">← Kembali ke Login</a>
        </div>
    </div>

    <script>
        const API_BASE_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:3000/api'
            : `${window.location.origin}/api`;

        const form = document.getElementById('registerForm');
        const alertBox = document.getElementById('alert');
        const submitBtn = document.getElementById('submitBtn');

        function showAlert(message, type) {
            alertBox.textContent = message;
            alertBox.className = `alert ${type}`;
            alertBox.style.display = 'block';

            setTimeout(() => {
                alertBox.style.display = 'none';
            }, 5000);
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const adminKey = document.getElementById('adminKey').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const kelas = document.getElementById('kelas').value;

            if (!adminKey || !username || !password || !kelas) {
                showAlert('Semua field harus diisi!', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Password minimal 6 karakter!', 'error');
                return;
            }

            // Show loading
            submitBtn.textContent = 'Mendaftarkan...';
            submitBtn.disabled = true;

            try {
                console.log('Calling API:', `${API_BASE_URL}/auth/register`);
                
                const response = await fetch(`${API_BASE_URL}/auth/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        adminKey,
                        username,
                        password,
                        kelas
                    })
                });

                console.log('Response status:', response.status);
                const data = await response.json();
                console.log('Response data:', data);

                if (response.ok && data.success) {
                    showAlert(`✅ ${data.message || 'User berhasil didaftarkan!'}`, 'success');
                    form.reset();
                } else {
                    showAlert(`❌ ${data.error || 'Gagal mendaftarkan user'}`, 'error');
                }

            } catch (error) {
                console.error('Register error:', error);
                showAlert(`❌ Gagal connect ke server: ${error.message}`, 'error');
            } finally {
                submitBtn.textContent = 'Daftarkan User';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
